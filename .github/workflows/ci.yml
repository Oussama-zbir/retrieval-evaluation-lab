name: CI

# Docs-only changes cannot change a run record, and reproducing the reranker
# records alone takes over an hour of runner time.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -v

  # Every checked-in run record must reproduce from the public data. One job per
  # dataset: records never span datasets, and the two halves run in parallel.
  reproduce:
    name: reproduce (${{ matrix.dataset }})
    runs-on: ubuntu-latest
    # About 50 minutes per dataset, mostly cross-encoder inference; a hung
    # download should fail the job, not hold the runner for six hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dataset: [scifact, nfcorpus]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # CPU wheels: the CUDA build of torch is several GB and unused here.
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dense]"

      - name: Cache embedding models
        id: hf-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('configs/dense-*.json', 'configs/hybrid-*.json', 'configs/rerank-*.json') }}

      - name: Cache dataset
        uses: actions/cache@v6
        with:
          path: |
            data/${{ matrix.dataset }}
            data/${{ matrix.dataset }}.zip
          key: beir-${{ matrix.dataset }}-${{ hashFiles('src/retrieval_lab/datasets.py') }}

      - name: Fetch and verify dataset
        run: retrieval-lab fetch ${{ matrix.dataset }}

      # Models are pinned to a revision, so a cache hit holds every file needed;
      # offline mode then skips the Hub round trip each model load makes.
      - name: Reproduce run records
        env:
          HF_HUB_OFFLINE: ${{ steps.hf-cache.outputs.cache-hit == 'true' && '1' || '' }}
        run: |
          for record in runs/${{ matrix.dataset }}/*.json; do
            retrieval-lab reproduce "$record"
          done

      # Prints the README significance tables from the checked-in records: the BM25
      # variants as one family of tests, dense against BM25 as another, and the
      # hybrid against each of its two components, the reranker against the
      # hybrid it reorders, and chunked dense against whole-document dense.
      - name: Compare against the BM25 baseline
        env:
          DATASET: ${{ matrix.dataset }}
        run: |
          retrieval-lab compare runs/$DATASET/*-bm25-780acdbb.json \
            runs/$DATASET/*-bm25-k1-09-b-04-*.json runs/$DATASET/*-bm25-no-stemming-*.json
          retrieval-lab compare runs/$DATASET/*-bm25-780acdbb.json \
            runs/$DATASET/*-dense-minilm-adc3aaae.json
          for component in runs/$DATASET/*-bm25-780acdbb.json runs/$DATASET/*-dense-minilm-adc3aaae.json; do
            retrieval-lab compare "$component" runs/$DATASET/*-hybrid-bm25-minilm-*.json
          done
          retrieval-lab compare runs/$DATASET/*-hybrid-bm25-minilm-*.json \
            runs/$DATASET/*-rerank-hybrid-minilm-*.json
          retrieval-lab compare runs/$DATASET/*-dense-minilm-adc3aaae.json \
            runs/$DATASET/*-dense-minilm-chunked-*.json
