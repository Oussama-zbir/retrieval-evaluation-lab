name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -v

  # Every checked-in run record must reproduce exactly from the public data.
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU wheels: the CUDA build of torch is several GB and unused here.
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dense]"

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('configs/dense-*.json', 'configs/hybrid-*.json', 'configs/rerank-*.json') }}

      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: data
          key: beir-${{ hashFiles('src/retrieval_lab/datasets.py') }}

      - name: Fetch and verify datasets
        run: |
          retrieval-lab fetch scifact
          retrieval-lab fetch nfcorpus

      - name: Reproduce run records
        run: |
          for record in runs/*/*.json; do
            retrieval-lab reproduce "$record"
          done

      # Prints the README significance tables from the checked-in records: the BM25
      # variants as one family of tests, dense against BM25 as another, and the
      # hybrid against each of its two components, and the reranker against the
      # hybrid it reorders.
      - name: Compare against the BM25 baseline
        run: |
          for dataset in scifact nfcorpus; do
            retrieval-lab compare runs/$dataset/*-bm25-780acdbb.json \
              runs/$dataset/*-bm25-k1-09-b-04-*.json runs/$dataset/*-bm25-no-stemming-*.json
            retrieval-lab compare runs/$dataset/*-bm25-780acdbb.json \
              runs/$dataset/*-dense-minilm-*.json
            for component in runs/$dataset/*-bm25-780acdbb.json runs/$dataset/*-dense-minilm-*.json; do
              retrieval-lab compare "$component" runs/$dataset/*-hybrid-bm25-minilm-*.json
            done
            retrieval-lab compare runs/$dataset/*-hybrid-bm25-minilm-*.json \
              runs/$dataset/*-rerank-hybrid-minilm-*.json
          done
